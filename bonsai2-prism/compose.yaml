services:
  bonsai2-prism:
    image: llama-cpp-prism-jetson:cuda-13.2
    build:
      context: .
      dockerfile: Dockerfile
    runtime: nvidia
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./models:/models:ro
    ports:
      - 127.0.0.1:8084:8080
    command:
      - --model
      - /models/Ternary-Bonsai-2-27B-PQ2_0.gguf
      - --alias
      - bonsai2-27b-pq2-prism
      - --mmproj
      - /models/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf
      - --jinja
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --flash-attn
      - "on"
      - --ctx-size
      - ${CTX_SIZE:-65536}
      - --n-gpu-layers
      - all
      - --parallel
      - "1"
      - --batch-size
      - "1024"
      - --ubatch-size
      - "256"
      - --threads
      - "8"
      - --threads-batch
      - "8"
      - --fit
      - "off"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    restart: "no"
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/health]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 6m

x-dockge:
  urls:
    - https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf
    - https://github.com/PrismML-Eng/llama.cpp
