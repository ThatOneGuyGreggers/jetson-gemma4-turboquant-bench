services:
  model:
    image: llama-cpp-jetson-bench:cuda-13.2
    runtime: nvidia
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${MODEL_DIR:?Set MODEL_DIR}:/models:ro
    ports:
      - 127.0.0.1:8094:8080
    command:
      - --model
      - /models/${MODEL_FILE:?Set MODEL_FILE}
      - --alias
      - ${MODEL_ALIAS:?Set MODEL_ALIAS}
      - --ctx-size
      - ${CTX_SIZE:-32768}
      - --n-gpu-layers
      - all
      - --parallel
      - "1"
      - --cache-type-k
      - q4_0
      - --cache-type-v
      - q4_0
      - --flash-attn
      - "on"
      - --batch-size
      - "512"
      - --ubatch-size
      - "128"
      - --threads
      - "8"
      - --fit
      - "off"
      - --jinja
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    restart: "no"
